name: Generate cyber contribution snake

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate neon snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300a896&color_dots=%23f1f8f5,%23a7f3d0,%235ee9b5,%2300c98d,%23006b5b
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2300ff9c&color_dots=%2305070a,%2300332b,%23006652,%2300a87a,%2300ff9c

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

